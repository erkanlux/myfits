<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F1EA" />
  <meta name="robots" content="noindex" />
  <title>MyFits beta</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    :root { --green: #2F5D4A; --cream: #F5F1EA; --pink: #F2789F; --pink-ink: #4B1528; --blue: #E4ECF4; --sand: #EDE4D3; --lilac: #E6DEF0; --sage: #DCE8E0; --blush: #F7E1E6; --mint: #DDEFEA; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--green); font: 400 16px/1.5 "Outfit", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 880px; margin: 0 auto; padding: 20px 16px 56px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .logo { font-weight: 600; font-size: 24px; }
    .logo span { color: var(--pink); }
    .langs { display: flex; gap: 2px; }
    .langs button { font: inherit; font-weight: 500; text-transform: uppercase; background: none; border: 0; color: rgb(47 93 74 / 0.5); min-width: 44px; min-height: 44px; border-radius: 22px; cursor: pointer; }
    .langs button[aria-pressed="true"] { color: var(--green); background: #fff; }
    h1 { font-weight: 600; font-size: clamp(34px, 8vw, 60px); line-height: 1.04; letter-spacing: -0.02em; margin: 32px 0 12px; }
    .lead { font-size: 18px; color: rgb(47 93 74 / 0.78); max-width: 600px; margin: 0; }
    .cta { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin: 28px 0 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 12px; background: var(--green); color: var(--cream); font-weight: 500; font-size: 17px; text-decoration: none; }
    .url { display: block; margin-top: 8px; font-size: 14px; color: rgb(47 93 74 / 0.6); word-break: break-all; }
    .qr { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 24px; padding: 14px 18px 14px 14px; }
    .qr img { width: 112px; height: 112px; display: block; }
    .qr p { margin: 0; font-size: 14px; max-width: 170px; }
    h2 { font-weight: 600; font-size: 24px; margin: 40px 0 14px; }
    .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .feature { background: #fff; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; }
    .feature .ico { font-size: 22px; line-height: 1.2; }
    .feature b { display: block; font-weight: 600; }
    .feature span { font-size: 14px; color: rgb(47 93 74 / 0.75); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { border-radius: 24px; padding: 20px; }
    .card h3 { margin: 0 0 10px; font-weight: 600; font-size: 18px; }
    .card ol { margin: 0; padding-left: 20px; }
    .card li { margin: 6px 0; }
    .card small { display: block; margin-top: 10px; color: rgb(47 93 74 / 0.7); font-size: 13px; }
    .blue { background: var(--blue); } .sand { background: var(--sand); } .lilac { background: var(--lilac); } .sage { background: var(--sage); } .blush { background: var(--blush); } .mint { background: var(--mint); }
    .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .steps li { counter-increment: s; background: #fff; border-radius: 12px; padding: 14px 16px 14px 52px; position: relative; }
    .steps li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: var(--cream); font-size: 13px; font-weight: 600; display: grid; place-items: center; }
    b { font-weight: 600; }
    .note { margin-top: 12px; border-radius: 12px; padding: 14px 16px; font-size: 15px; }
    .note ul { margin: 6px 0 0; padding-left: 20px; }
    kbd, code { font: inherit; font-weight: 500; background: #fff; border-radius: 6px; padding: 1px 6px; }
    @media (max-width: 720px) {
      .grid, .features { grid-template-columns: 1fr; }
      .qr { display: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="logo">MyFits<span>.</span></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">en</button>
      <button type="button" data-lang="fr">fr</button>
      <button type="button" data-lang="de">de</button>
    </div>
  </header>

  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="cta">
    <div>
      <a class="btn" href="../" data-t="open"></a>
      <span class="url">erkanlux.github.io/myfits</span>
    </div>
    <div class="qr">
      <img src="qr.png" alt="QR code" />
      <p data-t="qr"></p>
    </div>
  </div>

  <h2 data-t="whatTitle"></h2>
  <div class="features">
    <div class="feature"><div class="ico">👗</div><div><b data-t="f1t"></b><span data-t="f1"></span></div></div>
    <div class="feature"><div class="ico">🌦️</div><div><b data-t="f2t"></b><span data-t="f2"></span></div></div>
    <div class="feature"><div class="ico">📸</div><div><b data-t="f3t"></b><span data-t="f3"></span></div></div>
    <div class="feature"><div class="ico">✨</div><div><b data-t="f4t"></b><span data-t="f4"></span></div></div>
    <div class="feature"><div class="ico">📏</div><div><b data-t="f5t"></b><span data-t="f5"></span></div></div>
    <div class="feature"><div class="ico">🧺</div><div><b data-t="f6t"></b><span data-t="f6"></span></div></div>
    <div class="feature"><div class="ico">🧠</div><div><b data-t="f7t"></b><span data-t="f7"></span></div></div>
    <div class="feature"><div class="ico">🔒</div><div><b data-t="f8t"></b><span data-t="f8"></span></div></div>
  </div>

  <h2 data-t="installTitle"></h2>
  <div class="grid">
    <section class="card blue"><h3>Android</h3><ol><li data-t="a1"></li><li data-t="a2"></li><li data-t="a3"></li></ol></section>
    <section class="card sand"><h3>iPhone</h3><ol><li data-t="i1"></li><li data-t="i2"></li><li data-t="i3"></li></ol><small data-t="iNote"></small></section>
    <section class="card lilac"><h3 data-t="dTitle"></h3><ol><li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li></ol></section>
  </div>

  <h2 data-t="startTitle"></h2>
  <ol class="steps">
    <li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li><li data-t="s4"></li><li data-t="s5"></li><li data-t="s6"></li>
  </ol>

  <div class="note mint" data-t="premium"></div>
  <div class="note blush" data-t="privacy"></div>
  <div class="note sage" data-t="feedback"></div>
</main>

    feedback: '<b>Dites-nous ce que vous en pensez</b> après quelques jours, en répondant à la personne qui vous a invitée : avez-vous porté les tenues ? Qu’est-ce qui était confus ? Que changeriez-vous ? Paieriez-vous 2,99 €/mois ?',
  },

}
function pick() {
  try { const s = localStorage.getItem('myfits.lang'); if (s && T[s]) return s } catch (e) {}
  const n = (navigator.language || 'en').slice(0, 2)
  return T[n] ? n : 'en'
}
function show(lang) {
  document.documentElement.lang = lang
  document.title = { en: 'MyFits beta', fr: 'Bêta MyFits', de: 'MyFits-Beta' }[lang]
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T[lang][el.dataset.t] ?? T.en[el.dataset.t] ?? '' })
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)))
  try { localStorage.setItem('myfits.lang', lang) } catch (e) {}
}
document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.lang)))
show(pick())
</script>
</body>
</html>
